# Deploys the throwaway Realie bake-off Worker (christoclose-realie-lab).
# Separate from the live tax Worker; the name is pinned so it can never
# overwrite christoclose-tax or christoclose-api (Tick by Tick).
name: Deploy Realie lab Worker

on:
  push:
    branches: [main]
    paths:
      - 'realie-lab/**'
      - '.github/workflows/deploy-realie-lab.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the code
        run: cp realie-lab/worker.js /tmp/lab.mjs && node --check /tmp/lab.mjs
      - name: Deploy to Cloudflare (christoclose-realie-lab only)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.154.0"
          workingDirectory: realie-lab
          command: deploy --name christoclose-realie-lab
