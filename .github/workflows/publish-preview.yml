# "Publish preview to live" — the ONLY way the live calculator changes.
# Run it from the Actions tab (Publish preview to live → Run workflow) after
# the preview copy has been checked at /dti-calculator/preview/.
# It re-runs the math tests on the preview copy, and only if they pass,
# copies preview/index.html over the live index.html and publishes it.
name: Publish preview to live

on:
  workflow_dispatch:

concurrency:
  group: publish-live
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Make sure this is a new run, not a re-run of an old one
        run: |
          git fetch --quiet --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::This is a re-run of an OLD publish. Nothing was changed. To publish, go to Actions → Publish preview to live → Run workflow (not Re-run jobs)."
            exit 1
          fi

      - name: Anything to publish?
        id: diff
        run: |
          # The version lives in one line of CONFIG:  version: '8.30.3',
          ver() { grep -o "version: *'[0-9]\+\.[0-9]\+\.[0-9]\+'" "$1" | head -1 | grep -o "[0-9]\+\.[0-9]\+\.[0-9]\+" \
                  || grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+' "$1" | head -1 | tr -d v; }
          PREVIEW_VER=$(ver preview/index.html)
          LIVE_VER=$(ver index.html)
          echo "Preview version: v$PREVIEW_VER   Live version: v$LIVE_VER"
          if cmp -s preview/index.html index.html; then
            echo "Live already matches the preview copy — nothing to publish."
            echo "changed=no" >> "$GITHUB_OUTPUT"
          elif [ -z "$PREVIEW_VER" ]; then
            echo "::error::Could not find the version number in preview/index.html (CONFIG version line)."
            exit 1
          elif [ "$PREVIEW_VER" = "$LIVE_VER" ]; then
            echo "::error::The preview copy changed but still says v$PREVIEW_VER, same as live. Bump CONFIG version first."
            exit 1
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "version=v$PREVIEW_VER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'yes'
        with:
          node-version: "22"

      - name: Install test tools
        if: steps.diff.outputs.changed == 'yes'
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Math tests on the preview copy (must pass)
        if: steps.diff.outputs.changed == 'yes'
        run: npm test

      - name: Copy preview to live and test the live copy
        if: steps.diff.outputs.changed == 'yes'
        run: |
          cp preview/index.html index.html
          node tests/run.js --page index.html

      - name: Publish
        if: steps.diff.outputs.changed == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish preview ${{ steps.diff.outputs.version }} to live (math tests passed)"
          git push

      - name: Rebuild the live site
        if: steps.diff.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
