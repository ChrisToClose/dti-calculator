# Runs the math safety net (tests/run.js) on the PREVIEW copy whenever it or
# the tests change. A red X means a payment or DTI number changed.
# (The live copy is tested again by "Publish preview to live" before it changes.)
name: Math tests

on:
  push:
    paths:
      - "preview/index.html"
      - "index.html"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/math-tests.yml"
  pull_request:
    paths:
      - "preview/index.html"
      - "index.html"
      - "tests/**"
      - "package.json"
  workflow_dispatch:

jobs:
  math-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tools
        run: npm ci --no-audit --no-fund
      - name: Install headless browser
        run: npx playwright install --with-deps chromium
      - name: Run math tests on the preview copy
        run: npm test
      # Q9: if the LIVE page changed in this push, test it too. Live normally only
      # changes through "Publish preview to live"; anything else gets a red X here.
      - name: Did the live page change?
        id: live
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then BEFORE="HEAD~1"; fi
          if git diff --name-only "$BEFORE" HEAD 2>/dev/null | grep -qx "index.html"; then echo "changed=yes" >> "$GITHUB_OUTPUT"; else echo "changed=no" >> "$GITHUB_OUTPUT"; fi
      - name: Run math tests on the live copy
        if: steps.live.outputs.changed == 'yes'
        run: node tests/run.js --page index.html
